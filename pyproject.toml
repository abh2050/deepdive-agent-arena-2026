[project]
name = "deepdive-agent-arena"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
